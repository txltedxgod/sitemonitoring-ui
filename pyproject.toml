[project]
name = "sitemonitoring-ui"
version = "0.2.0"
description = "Self-hosted uptime monitor with Pulse SPA UI, JSON API, and Telegram alerts."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
